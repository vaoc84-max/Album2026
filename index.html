<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Álbum 2026">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#E8192C">
<title>Álbum FIFA World Cup 2026 ⚽</title>
<style>
:root{--bg:#FFF;--bg2:#F8F9FA;--bg3:#EEF0F2;--tx:#111827;--tx2:#6B7280;--bd:rgba(0,0,0,.09);--bd2:rgba(0,0,0,.18);--r:10px;--rl:14px;--hh:130px}
@media(prefers-color-scheme:dark){:root{--bg:#0D0D0D;--bg2:#1A1A1A;--bg3:#252525;--tx:#F9FAFB;--tx2:#9CA3AF;--bd:rgba(255,255,255,.08);--bd2:rgba(255,255,255,.18)}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg);overscroll-behavior:none}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;color:var(--tx)}
::-webkit-scrollbar{display:none}
button{font-family:inherit;cursor:pointer;transition:transform .1s;user-select:none}
button:active{transform:scale(.96)}
input[type=text],input[type=password]{width:100%;padding:10px 12px;border:.5px solid var(--bd2);border-radius:var(--r);font-size:14px;background:var(--bg2);color:var(--tx);outline:none;font-family:inherit}
input:focus{border-color:#E8192C}
select{width:100%;padding:10px 12px;border:.5px solid var(--bd2);border-radius:var(--r);font-size:14px;color:var(--tx);background:var(--bg);margin-bottom:14px;font-family:inherit}
textarea{width:100%;padding:10px 12px;border:.5px solid var(--bd);border-radius:var(--r);font-size:11px;line-height:1.7;background:var(--bg2);color:var(--tx2);resize:none;height:200px;outline:none;font-family:monospace}
#root{max-width:430px;margin:0 auto;padding-top:var(--hh);padding-bottom:20px}
.hdr{position:fixed;top:0;top:env(safe-area-inset-top,0);left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--bg);z-index:100;border-bottom:.5px solid var(--bd)}
</style>
</head>
<body>
<div id="root"></div>
<script>
const T=[
  {c:'MEX',n:'México',f:'🇲🇽',col:'#006847'},{c:'RSA',n:'Sudáfrica',f:'🇿🇦',col:'#009A44'},
  {c:'KOR',n:'Corea del Sur',f:'🇰🇷',col:'#C60C30'},{c:'CZE',n:'Rep. Checa',f:'🇨🇿',col:'#D7141A'},
  {c:'CAN',n:'Canadá',f:'🇨🇦',col:'#D52B1E'},{c:'BIH',n:'Bosnia y Herz.',f:'🇧🇦',col:'#002395'},
  {c:'QAT',n:'Qatar',f:'🇶🇦',col:'#8D1B3D'},{c:'SUI',n:'Suiza',f:'🇨🇭',col:'#CC0000'},
  {c:'BRA',n:'Brasil',f:'🇧🇷',col:'#009C3B'},{c:'MAR',n:'Marruecos',f:'🇲🇦',col:'#C1272D'},
  {c:'HAI',n:'Haití',f:'🇭🇹',col:'#00209F'},{c:'SCO',n:'Escocia',f:'🏴󠁧󠁢󠁳󠁣󠁴󠁿',col:'#003063'},
  {c:'USA',n:'EE.UU.',f:'🇺🇸',col:'#002868'},{c:'PAR',n:'Paraguay',f:'🇵🇾',col:'#D52B1E'},
  {c:'AUS',n:'Australia',f:'🇦🇺',col:'#00843D'},{c:'TUR',n:'Turquía',f:'🇹🇷',col:'#E30A17'},
  {c:'GER',n:'Alemania',f:'🇩🇪',col:'#333'},{c:'CUW',n:'Curazao',f:'🇨🇼',col:'#002B7F'},
  {c:'CIV',n:'C. de Marfil',f:'🇨🇮',col:'#E07000'},{c:'ECU',n:'Ecuador',f:'🇪🇨',col:'#B8960A'},
  {c:'NED',n:'Países Bajos',f:'🇳🇱',col:'#CC4400'},{c:'JPN',n:'Japón',f:'🇯🇵',col:'#BC002D'},
  {c:'SWE',n:'Suecia',f:'🇸🇪',col:'#006AA7'},{c:'TUN',n:'Túnez',f:'🇹🇳',col:'#E70013'},
  {c:'BEL',n:'Bélgica',f:'🇧🇪',col:'#EF3340'},{c:'EGY',n:'Egipto',f:'🇪🇬',col:'#C8102E'},
  {c:'IRN',n:'Irán',f:'🇮🇷',col:'#239F40'},{c:'NZL',n:'Nueva Zelanda',f:'🇳🇿',col:'#00247D'},
  {c:'ESP',n:'España',f:'🇪🇸',col:'#C60B1E'},{c:'CPV',n:'Cabo Verde',f:'🇨🇻',col:'#003893'},
  {c:'KSA',n:'Arabia Saudita',f:'🇸🇦',col:'#006C35'},{c:'URU',n:'Uruguay',f:'🇺🇾',col:'#3A7CB5'},
  {c:'FRA',n:'Francia',f:'🇫🇷',col:'#002395'},{c:'SEN',n:'Senegal',f:'🇸🇳',col:'#00853F'},
  {c:'IRQ',n:'Iraq',f:'🇮🇶',col:'#CE1126'},{c:'NOR',n:'Noruega',f:'🇳🇴',col:'#CC1133'},
  {c:'ARG',n:'Argentina',f:'🇦🇷',col:'#3A7CB5'},{c:'ALG',n:'Argelia',f:'🇩🇿',col:'#006233'},
  {c:'AUT',n:'Austria',f:'🇦🇹',col:'#ED2939'},{c:'JOR',n:'Jordania',f:'🇯🇴',col:'#007A3D'},
  {c:'POR',n:'Portugal',f:'🇵🇹',col:'#006600'},{c:'COD',n:'R.D. Congo',f:'🇨🇩',col:'#007FFF'},
  {c:'UZB',n:'Uzbekistán',f:'🇺🇿',col:'#1EB53A'},{c:'COL',n:'Colombia',f:'🇨🇴',col:'#B8920A'},
  {c:'ENG',n:'Inglaterra',f:'🏴󠁧󠁢󠁥󠁮󠁧󠁿',col:'#CF081F'},{c:'CRO',n:'Croacia',f:'🇭🇷',col:'#CC0000'},
  {c:'GHA',n:'Ghana',f:'🇬🇭',col:'#006B3F'},{c:'PAN',n:'Panamá',f:'🇵🇦',col:'#005293'},
];
const F1=['FWC1','FWC2','FWC3','FWC4','FWC5','FWC6','FWC7','FWC8'];
const F2=Array.from({length:11},(_,i)=>`FWC${i+9}`);
const CC=Array.from({length:14},(_,i)=>`CC${i+1}`);
const TOTAL=993;
const RC='#E8192C',BC='#1A56DB',OC='#FF6600',GC='#00943A',YC='#FFD100',PC='#7B2D8B',VC='#8B5CF6';
const RB=`linear-gradient(90deg,${RC},${OC},${YC},${GC},${BC},${PC})`;

let owned=new Set(), repeats={}, pending=null, ptimer=null;
let sec='fwc1', expT=null, sq='', sRes=null, tf='all';
let vShare=false, vScan=false, vCfg=false, scanning=false;
let savT=null;
window._ss='all'; window._sc='team'; window._st='';
let apiKey=localStorage.getItem('wc_apikey')||'';

function loadStorage(){
  try{const v=localStorage.getItem('wc26_v5');if(v)owned=new Set(JSON.parse(v));}catch(e){}
  try{const r=localStorage.getItem('wc26_rep');if(r)repeats=JSON.parse(r);}catch(e){}
  render();
}
function saveStorage(){
  clearTimeout(savT);
  savT=setTimeout(()=>{
    try{localStorage.setItem('wc26_v5',JSON.stringify([...owned]));}catch(e){}
    try{localStorage.setItem('wc26_rep',JSON.stringify(repeats));}catch(e){}
  },600);
}

let _lpT=null,_lpW=false;
window.lpS=function(id){
  _lpW=false;
  _lpT=setTimeout(()=>{
    if(!owned.has(id)){flash('Primero marca el cromo','#F59E0B');return;}
    _lpW=true;
    repeats[id]=(repeats[id]||0)+1;
    saveStorage();
    if(navigator.vibrate)navigator.vibrate(60);
    flash('Repetido \xd7'+(repeats[id]+1)+' \ud83d\udd01',VC);
    render();
  },600);
};
window.lpE=function(){clearTimeout(_lpT);};

const $=id=>document.getElementById(id);
function flash(msg,col){
  const old=$('xt');
  const el=document.createElement('div');
  el.id='xt';
  el.style.cssText='position:fixed;top:max(env(safe-area-inset-top,0px),12px);left:50%;transform:translateX(-50%);background:'+col+';color:#fff;padding:9px 20px;border-radius:20px;font-weight:600;font-size:13px;z-index:9999;pointer-events:none;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.25)';
  el.textContent=msg;
  if(old)old.replaceWith(el);else document.body.appendChild(el);
  setTimeout(()=>el.remove(),2200);
}
function tog(id){
  if(_lpW){_lpW=false;return;}
  if(owned.has(id)){
    if(pending===id){
      owned.delete(id);delete repeats[id];
      pending=null;clearTimeout(ptimer);
      saveStorage();flash('Eliminado','#EF4444');
    }else{
      clearTimeout(ptimer);pending=id;
      ptimer=setTimeout(()=>{pending=null;render();},3000);
    }
  }else{
    owned.add(id);clearTimeout(ptimer);pending=null;
    saveStorage();flash('\xa1Pegado! \u2705',GC);
  }
  render();
}
function go(s){sec=s;expT=null;sq='';tf='all';render();}
function exT(c){if(expT!==c)tf='all';expT=expT===c?null:c;render();}
window.setTF=function(f){tf=f;render();};
window.markAll=function(code){
  Array.from({length:20},(_,i)=>code+(i+1)).forEach(id=>owned.add(id));
  saveStorage();flash('20 cromos marcados \u2705',GC);render();
};
window.clearAll=function(code){
  if(!confirm('\xbfDesmarcar todos los cromos de este equipo?'))return;
  Array.from({length:20},(_,i)=>code+(i+1)).forEach(id=>{owned.delete(id);delete repeats[id];});
  saveStorage();flash('Equipo desmarcado','#EF4444');render();
};

function repBadge(id){
  const r=repeats[id]||0;if(!r)return'';
  return'<span style="position:absolute;top:-6px;right:-6px;background:'+VC+';color:#fff;border-radius:999px;min-width:18px;height:18px;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);padding:0 3px">\xd7'+(r+1)+'</span>';
}
function sb(id,lbl,col){
  const o=owned.has(id),p=pending===id,rep=(repeats[id]||0)>0;
  const bg=p?'#F59E0B':rep?VC:o?(col||GC):'var(--bg)';
  const tc=(o||p)?'#fff':'var(--tx2)';
  const bc=p?'#D97706':o?'transparent':'var(--bd2)';
  return'<button onclick="tog(\''+id+'\')" ontouchstart="lpS(\''+id+'\')" ontouchend="lpE()" ontouchmove="lpE()" oncontextmenu="return false" style="background:'+bg+';color:'+tc+';border:2px solid '+bc+';border-radius:10px;width:100%;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative;user-select:none;-webkit-user-select:none"><span style="font-size:12px;font-weight:700">'+lbl+'</span>'+(p?'<span style="position:absolute;top:2px;right:4px;font-size:9px;font-weight:700">\u2715</span>':'')+repBadge(id)+'</button>';
}
function gb(id,col){
  const o=owned.has(id),p=pending===id,rep=(repeats[id]||0)>0;
  const bg=p?'#F59E0B':rep?VC:o?col:'var(--bg)';
  const tc=(o||p)?'#fff':'var(--tx2)';
  const bc=p?'#D97706':o?'transparent':'var(--bd2)';
  return'<button onclick="tog(\''+id+'\')" ontouchstart="lpS(\''+id+'\')" ontouchend="lpE()" ontouchmove="lpE()" oncontextmenu="return false" style="background:'+bg+';color:'+tc+';border:2px solid '+bc+';border-radius:10px;padding:10px 4px;font-weight:700;font-size:12px;min-height:52px;position:relative;user-select:none;-webkit-user-select:none">'+id+(p?'<span style="position:absolute;top:2px;right:4px;font-size:9px">\u2715</span>':'')+repBadge(id)+'</button>';
}
function dn(pct,col,sz){
  const r=40,cv=2*Math.PI*r,d=(pct/100)*cv;
  return'<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 100 100"><circle cx="50" cy="50" r="'+r+'" fill="none" stroke="var(--bg3)" stroke-width="10"/><circle cx="50" cy="50" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="10" stroke-dasharray="'+d.toFixed(1)+' '+cv.toFixed(1)+'" stroke-linecap="round" transform="rotate(-90 50 50)"/><text x="50" y="45" text-anchor="middle" font-size="18" font-weight="700" fill="'+col+'">'+pct+'%</text><text x="50" y="61" text-anchor="middle" font-size="9" fill="var(--tx2)">completado</text></svg>';
}

function tRow(t){
  const ids=Array.from({length:20},(_,i)=>t.c+(i+1));
  const cnt=ids.filter(id=>owned.has(id)).length,done=cnt===20,exp=expT===t.c;
  const repCnt=ids.filter(id=>(repeats[id]||0)>0).length;
  const fN=nums=>{
    if(tf==='have')return nums.filter(n=>owned.has(t.c+n));
    if(tf==='miss')return nums.filter(n=>!owned.has(t.c+n));
    return nums;
  };
  const p1n=fN(Array.from({length:10},(_,i)=>i+1));
  const p2n=fN(Array.from({length:10},(_,i)=>i+11));
  const p1=exp?p1n.map(n=>sb(t.c+n,n===1?'\u2b50':String(n),t.col)).join(''):'';
  const p2=exp?p2n.map(n=>sb(t.c+n,n===13?'\ud83d\udcf8':String(n),t.col)).join(''):'';
  const noMsg=pg=>'<div style="padding:8px 0 10px;text-align:center;font-size:12px;color:var(--tx2)">'+(tf==='have'?'Sin cromos en '+pg:'\xa1'+pg+' completa! \u2705')+'</div>';
  const repBadgeRow=repCnt>0?' <span style="color:'+VC+';font-size:10px">\ud83d\udd01'+repCnt+'</span>':'';
  return'<div style="background:var(--bg);border-bottom:.5px solid var(--bd)">'+
    '<button onclick="exT(\''+t.c+'\')" style="width:100%;display:flex;align-items:center;gap:10px;padding:9px 14px;background:none;border:none;text-align:left">'+
    '<span style="font-size:22px;flex-shrink:0">'+t.f+'</span>'+
    '<div style="flex:1;min-width:0">'+
    '<div style="display:flex;justify-content:space-between;margin-bottom:3px;align-items:baseline">'+
    '<span style="font-weight:600;font-size:13px;color:var(--tx)">'+t.n+' <span style="font-size:10px;font-weight:500;color:var(--tx2)">'+t.c+'</span></span>'+
    '<span style="font-size:12px;color:'+(done?GC:'var(--tx2)')+';font-weight:600">'+(done?'\u2705':cnt+'/20')+repBadgeRow+'</span>'+
    '</div>'+
    '<div style="height:4px;background:var(--bg3);border-radius:999px;overflow:hidden">'+
    '<div style="height:100%;width:'+((cnt/20)*100)+'%;background:'+(done?GC:t.col)+';border-radius:999px"></div>'+
    '</div></div>'+
    '<span style="color:var(--tx2);font-size:13px;flex-shrink:0;display:inline-block;transform:'+(exp?'rotate(180deg)':'none')+';transition:transform .2s">\u25be</span>'+
    '</button>'+
    (exp?'<div style="background:var(--bg2);padding:10px 12px 14px;border-top:.5px solid var(--bd)">'+
    '<div style="display:flex;gap:6px;margin-bottom:10px">'+
    '<button onclick="markAll(\''+t.c+'\')" style="flex:1;padding:7px;border-radius:10px;border:1.5px solid '+GC+';color:'+GC+';background:transparent;font-size:12px;font-weight:600">\u2705 Marcar todos</button>'+
    '<button onclick="clearAll(\''+t.c+'\')" style="flex:1;padding:7px;border-radius:10px;border:1.5px solid var(--bd2);color:var(--tx2);background:transparent;font-size:12px;font-weight:600">\u21a9 Desmarcar</button>'+
    '</div>'+
    '<div style="display:flex;gap:4px;margin-bottom:12px">'+
    [['all','Todos'],['have','Tengo'],['miss','Faltan']].map(([v,l])=>'<button onclick="setTF(\''+v+'\')" style="flex:1;padding:5px 4px;border-radius:20px;border:1.5px solid;font-size:11px;font-weight:600;background:'+(tf===v?'var(--tx)':'var(--bg)')+';color:'+(tf===v?'var(--bg)':'var(--tx)')+';border-color:'+(tf===v?'var(--tx)':'var(--bd2)')+'">'+l+'</button>').join('')+
    '</div>'+
    (p1n.length?'<div style="font-size:10px;color:var(--tx2);font-weight:700;letter-spacing:.5px;margin-bottom:7px">P\xc1G 1 \u2014 CROMOS 1 AL 10</div><div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin-bottom:12px">'+p1+'</div>':noMsg('P\xe1g 1'))+
    (p2n.length?'<div style="font-size:10px;color:var(--tx2);font-weight:700;letter-spacing:.5px;margin-bottom:7px">P\xc1G 2 \u2014 CROMOS 11 AL 20</div><div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px">'+p2+'</div>':noMsg('P\xe1g 2'))+
    '<p style="font-size:10px;color:var(--tx2);margin-top:10px;text-align:center">Mant\xe9n presionado un cromo para marcarlo como repetido \ud83d\udd01</p>'+
    '</div>':'')+'</div>';
}

window.hs=function(v){
  sq=v;const el=$('tl');if(!el)return;
  const q=v.toLowerCase();
  const f=q?T.filter(t=>t.n.toLowerCase().includes(q)||t.c.toLowerCase().includes(q)):T;
  el.innerHTML=f.length?f.map(tRow).join(''):'<div style="padding:30px;text-align:center;color:var(--tx2)">Sin resultados para "'+v+'"</div>';
};

function genTxt(){
  const sel=window._ss||'all';
  const l=['\ud83c\udfc6 *FIFA World Cup 2026 \u2014 \xc1lbum Panini*\n'];
  if(sel==='reps'){
    l.push('\ud83d\udd01 *Cromos REPETIDOS (puedo dar):*\n');
    T.forEach(t=>{
      const rp=Array.from({length:20},(_,i)=>i+1).filter(n=>(repeats[t.c+n]||0)>0);
      if(rp.length)l.push(t.f+' *'+t.n+' '+t.c+':* '+rp.map(n=>t.c+n+'(\xd7'+((repeats[t.c+n]||0)+1)+')').join(' '));
    });
    [...F1,...F2,...CC].forEach(id=>{if((repeats[id]||0)>0)l.push(id+'(\xd7'+((repeats[id]||0)+1)+')');});
    return l.join('\n');
  }
  l.push('Cromos que me FALTAN:\n');
  if(sel==='all'||sel==='fwc1'){const m=F1.filter(id=>!owned.has(id));if(m.length)l.push('\ud83d\udd34 *FWC 1:* '+m.join(' '));}
  if(sel==='all'||sel==='teams'){
    const tl=[];
    T.forEach(t=>{
      const m=Array.from({length:20},(_,i)=>t.c+(i+1)).filter(id=>!owned.has(id));
      if(m.length)tl.push(t.f+' *'+t.n+' '+t.c+':* '+m.map(id=>id.replace(t.c,'')).join(' '));
    });
    if(tl.length){l.push('\n\ud83c\udf0d *Selecciones:*');l.push(...tl);}
  }
  if(sel==='all'||sel==='fwc2'){const m=F2.filter(id=>!owned.has(id));if(m.length)l.push('\n\ud83d\udfe0 *FWC 2:* '+m.join(' '));}
  if(sel==='all'||sel==='coca'){const m=CC.filter(id=>!owned.has(id));if(m.length)l.push('\n\ud83e\udd64 *Coca-Cola:* '+m.join(' '));}
  return l.join('\n');
}
window.uST=function(){
  const sel=window._ss||'all';
  const tp=[['all','Todo'],['fwc1','FWC 1'],['teams','Selecciones'],['fwc2','FWC 2'],['coca','Coca-Cola'],['reps','\ud83d\udd01 Repetidos']];
  const st=$('stabs'),sp=$('sp');
  if(st)st.innerHTML=tp.map(([v,l])=>'<button onclick="window._ss=\''+v+'\';window.uST()" style="padding:4px 10px;border-radius:20px;border:2px solid;font-size:11px;font-weight:600;background:'+(sel===v?'var(--tx)':'var(--bg)')+';color:'+(sel===v?'var(--bg)':'var(--tx)')+';border-color:'+(sel===v?'var(--tx)':'var(--bd2)')+'">'+l+'</button>').join('');
  if(sp)sp.value=genTxt();
};
window.uScT=function(){
  const sect=window._sc||'team';
  const tp=[['team','Selecci\xf3n'],['fwc1','FWC 1'],['fwc2','FWC 2'],['coca','Coca-Cola']];
  const st=$('sctabs');if(!st)return;
  st.innerHTML=tp.map(([v,l])=>'<button onclick="window._sc=\''+v+'\';window.uScT()" style="padding:4px 10px;border-radius:20px;border:2px solid;font-size:11px;font-weight:600;background:'+(sect===v?'var(--tx)':'var(--bg)')+';color:'+(sect===v?'var(--bg)':'var(--tx)')+';border-color:'+(sect===v?'var(--tx)':'var(--bd2)')+'">'+l+'</button>').join('');
  const st2=$('scteam');if(st2)st2.style.display=sect==='team'?'block':'none';
};
window.doScan=async function(e){
  const file=e.target.files&&e.target.files[0];if(!file)return;
  if(!apiKey){flash('Agrega tu API key en \u2699\ufe0f','#F59E0B');return;}
  const sect=window._sc||'team',tc=window._st||'';
  scanning=true;render();
  const reader=new FileReader();
  reader.onload=async ev=>{
    const b64=ev.target.result.split(',')[1];
    let ctx='',ids=[];
    if(sect==='team'&&tc){const tm=T.find(t=>t.c===tc);ctx='Secci\xf3n '+tc+' ('+(tm?tm.n:'')+') \xe1lbum Panini FIFA World Cup 2026. 20 espacios 1-20. Cromo 1=escudo hologr\xe1fico, cromo 13=foto equipo.';ids=Array.from({length:20},(_,i)=>tc+(i+1));}
    else if(sect==='fwc1'){ctx='Secci\xf3n FWC inicial, cromos FWC1-FWC8.';ids=F1;}
    else if(sect==='fwc2'){ctx='Secci\xf3n FWC final, cromos FWC9-FWC19.';ids=F2;}
    else{ctx='Secci\xf3n Coca-Cola, cromos CC1-CC14.';ids=CC;}
    try{
      const res=await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:600,messages:[{role:'user',content:[
          {type:'image',source:{type:'base64',media_type:file.type||'image/jpeg',data:b64}},
          {type:'text',text:ctx+'\nIDs: '+ids.join(', ')+'. PEGADOS vs VAC\xcdOS. Solo JSON: {"filled":["ID1",...],"empty":["ID2",...]}'}
        ]}]})
      });
      const data=await res.json();
      const txt=(data.content||[]).find(c=>c.type==='text')?.text||'';
      const result=JSON.parse(txt.replace(/```json|```/g,'').trim());
      if(result.filled){
        const newOnes=result.filled.filter(id=>!owned.has(id));
        const dup=result.filled.filter(id=>owned.has(id));
        newOnes.forEach(id=>owned.add(id));
        saveStorage();sRes={ok:true,newOnes,dup};
      }else sRes={ok:true,newOnes:[],dup:[]};
    }catch(err){sRes={ok:false,msg:String(err)};}
    scanning=false;render();
  };
  reader.readAsDataURL(file);
};

function statsPage(fn,fn2,cn,tn,tot){
  const pct=Math.round((tot/TOTAL)*100);
  const compl=T.filter(t=>Array.from({length:20},(_,i)=>t.c+(i+1)).every(id=>owned.has(id))).length;
  const totalReps=Object.values(repeats).reduce((s,v)=>s+v,0);
  const sorted=[...T].map(t=>{const cnt=Array.from({length:20},(_,i)=>t.c+(i+1)).filter(id=>owned.has(id)).length;return{...t,cnt};}).sort((a,b)=>b.cnt-a.cnt);
  const sBars=[{l:'FWC 1',n:fn,t:8,col:RC},{l:'Selecciones',n:tn,t:960,col:BC},{l:'FWC 2',n:fn2,t:11,col:OC},{l:'Coca-Cola',n:cn,t:14,col:'#E8000B'}].map(s=>{
    const p=Math.round((s.n/s.t)*100);
    return'<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;margin-bottom:3px"><span style="font-size:13px;font-weight:600;color:var(--tx)">'+s.l+'</span><span style="font-size:12px;color:var(--tx2)">'+s.n+'/'+s.t+' \xb7 '+p+'%</span></div><div style="height:7px;background:var(--bg3);border-radius:999px;overflow:hidden"><div style="height:100%;width:'+p+'%;background:'+s.col+';border-radius:999px"></div></div></div>';
  }).join('');
  const tRows=sorted.map(t=>{const p=Math.round((t.cnt/20)*100),done=t.cnt===20;return'<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:.5px solid var(--bd)"><span style="font-size:18px;flex-shrink:0">'+t.f+'</span><div style="flex:1;min-width:0"><div style="font-size:12px;font-weight:600;color:var(--tx)">'+t.n+' <span style="color:var(--tx2);font-size:10px">'+t.c+'</span></div><div style="height:3px;background:var(--bg3);border-radius:999px;margin-top:3px"><div style="height:100%;width:'+p+'%;background:'+(done?GC:t.col)+';border-radius:999px"></div></div></div><span style="font-size:11px;color:'+(done?GC:'var(--tx2)')+';font-weight:600;flex-shrink:0">'+(done?'\u2705':t.cnt+'/20')+'</span></div>';}).join('');
  const cards=[['Tengo',tot,GC],['Faltan',TOTAL-tot,RC],['Equipos \u2705',compl,BC],['Repetidos',totalReps,VC]].map(([l,v,c])=>'<div style="background:var(--bg2);border-radius:var(--r);padding:12px;text-align:center"><div style="font-size:22px;font-weight:700;color:'+c+'">'+v+'</div><div style="font-size:11px;color:var(--tx2);margin-top:2px">'+l+'</div></div>').join('');
  return'<div style="padding:16px 14px"><div style="display:flex;justify-content:center;padding:4px 0 16px">'+dn(pct,RC,140)+'</div><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:20px">'+cards+'</div><div style="font-weight:600;font-size:13px;color:var(--tx);margin-bottom:10px">Avance por secci\xf3n</div>'+sBars+'<div style="font-weight:600;font-size:13px;color:var(--tx);margin:16px 0 8px">Por selecci\xf3n</div>'+tRows+'</div>';
}

function pgH(title,back){
  return'<div class="hdr" id="hdr"><div style="background:'+RB+';height:4px"></div><div style="display:flex;align-items:center;gap:10px;padding:13px 16px;background:var(--bg)"><button onclick="'+back+'" style="background:none;border:none;font-size:22px;line-height:1;color:var(--tx);padding:4px">\u2190</button><span style="font-weight:600;font-size:16px;color:var(--tx);flex:1">'+title+'</span></div></div>';
}

function render(){
  const fn=F1.filter(id=>owned.has(id)).length;
  const fn2=F2.filter(id=>owned.has(id)).length;
  const cn=CC.filter(id=>owned.has(id)).length;
  const tn=T.reduce((s,t)=>s+Array.from({length:20},(_,i)=>t.c+(i+1)).filter(id=>owned.has(id)).length,0);
  const tot=fn+fn2+cn+tn,pct=Math.round((tot/TOTAL)*100);

  if(vShare){
    const sel=window._ss||'all';
    const tp=[['all','Todo'],['fwc1','FWC 1'],['teams','Selecciones'],['fwc2','FWC 2'],['coca','Coca-Cola'],['reps','\ud83d\udd01 Repetidos']].map(([v,l])=>'<button onclick="window._ss=\''+v+'\';window.uST()" style="padding:4px 10px;border-radius:20px;border:2px solid;font-size:11px;font-weight:600;background:'+(sel===v?'var(--tx)':'var(--bg)')+';color:'+(sel===v?'var(--bg)':'var(--tx)')+';border-color:'+(sel===v?'var(--tx)':'var(--bd2)')+'">'+l+'</button>').join('');
    $('root').innerHTML=pgH('Compartir \ud83d\udce4','vShare=false;render()')+'<div style="padding:16px"><div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px" id="stabs">'+tp+'</div><textarea id="sp" readonly>'+genTxt()+'</textarea><div style="display:flex;gap:8px;margin-top:12px"><button onclick="window.open(\'https://wa.me/?text=\'+encodeURIComponent(document.getElementById(\'sp\').value),\'_blank\')" style="flex:1;background:#25D366;color:#fff;border:none;border-radius:12px;padding:13px;font-weight:600;font-size:15px">WhatsApp \ud83d\udcf1</button><button onclick="navigator.clipboard?.writeText(document.getElementById(\'sp\').value).then(()=>flash(\'\xa1Copiado!\',\''+GC+'\'))" style="background:var(--bg2);color:var(--tx);border:.5px solid var(--bd2);border-radius:12px;padding:13px 16px;font-size:16px">\ud83d\udccb</button></div><p style="font-size:11px;color:var(--tx2);margin-top:12px;text-align:center;line-height:1.5">Usa <b>\ud83d\udd01 Repetidos</b> para ofrecer tus cromos extras</p></div>';
    setHH();return;
  }
  if(vCfg){
    $('root').innerHTML=pgH('Ajustes \u2699\ufe0f','vCfg=false;render()')+'<div style="padding:16px"><div style="font-weight:600;font-size:14px;color:var(--tx);margin-bottom:6px">API key de Anthropic (escaneo con IA)</div><p style="font-size:12px;color:var(--tx2);margin-bottom:12px;line-height:1.5">Gratis en <a href="https://console.anthropic.com" target="_blank" style="color:'+RC+'">console.anthropic.com</a> \u2192 API Keys \u2192 Create Key</p><input type="password" id="ak" value="'+apiKey+'" placeholder="sk-ant-..."><button onclick="apiKey=document.getElementById(\'ak\').value;localStorage.setItem(\'wc_apikey\',apiKey);flash(\'API key guardada \u2705\',\''+GC+'\');vCfg=false;render()" style="width:100%;margin-top:12px;background:var(--tx);color:var(--bg);border:none;border-radius:12px;padding:14px;font-weight:600;font-size:15px">Guardar</button><div style="margin-top:20px;padding:14px;background:var(--bg2);border-radius:var(--rl)"><div style="font-weight:600;font-size:13px;color:var(--tx);margin-bottom:6px">\ud83d\udcf1 Instalar como app</div><p style="font-size:12px;color:var(--tx2);line-height:1.6"><b>iPhone:</b> Safari \u2192 bot\xf3n compartir \u2192 "Agregar a pantalla de inicio"<br><b>Android:</b> Chrome \u2192 men\xfa \u22ee \u2192 "Agregar a pantalla de inicio"</p></div><div style="margin-top:16px;padding-top:16px;border-top:.5px solid var(--bd)"><div style="font-weight:600;font-size:13px;color:'+RC+';margin-bottom:10px">Zona de peligro</div><button onclick="if(confirm(\'\xbfBorrar TODOS los datos del \xe1lbum?\')){owned=new Set();repeats={};saveStorage();flash(\'Reiniciado\',\''+RC+'\');vCfg=false;render();}" style="width:100%;background:transparent;color:'+RC+';border:1.5px solid '+RC+';border-radius:12px;padding:13px;font-weight:600;font-size:14px">Reiniciar \xe1lbum desde cero</button></div></div>';
    setHH();return;
  }
  if(vScan){
    if(sRes){
      const {ok,newOnes,dup}=sRes;
      $('root').innerHTML=pgH('Resultado del escaneo','vScan=false;sRes=null;render()')+'<div style="padding:16px">'+(
        !ok?'<div style="background:var(--bg2);border-radius:var(--r);padding:16px;text-align:center;color:var(--tx2)">No se pudo analizar. Verifica tu API key en \u2699\ufe0f.</div>':
        (newOnes&&newOnes.length?'<div style="background:#DCFCE7;border-radius:var(--r);padding:14px;margin-bottom:10px"><div style="font-weight:600;color:#15803D;font-size:14px;margin-bottom:6px">\u2705 '+newOnes.length+' nuevos agregados</div><div style="font-size:12px;color:#166534;line-height:1.8">'+newOnes.join(', ')+'</div></div>':
        '<div style="background:var(--bg2);border-radius:var(--r);padding:12px;margin-bottom:10px;color:var(--tx2);font-size:13px;text-align:center">No se detectaron cromos nuevos.</div>')+
        (dup&&dup.length?'<div style="background:#FEF9C3;border-radius:var(--r);padding:14px"><div style="font-weight:600;color:#A16207;font-size:14px;margin-bottom:6px">\u26a0\ufe0f '+dup.length+' ya los ten\xedas</div><div style="font-size:12px;color:#92400E;line-height:1.8">'+dup.join(', ')+'</div></div>':'')
      )+'<button onclick="vScan=false;sRes=null;render()" style="width:100%;margin-top:16px;background:var(--tx);color:var(--bg);border:none;border-radius:12px;padding:14px;font-weight:600;font-size:15px">Continuar</button></div>';
      setHH();return;
    }
    const sect=window._sc||'team',tm=window._st||'';
    const ok=sect!=='team'||tm;
    const sctbs=[['team','Selecci\xf3n'],['fwc1','FWC 1'],['fwc2','FWC 2'],['coca','Coca-Cola']].map(([v,l])=>'<button onclick="window._sc=\''+v+'\';window.uScT()" style="padding:4px 10px;border-radius:20px;border:2px solid;font-size:11px;font-weight:600;background:'+(sect===v?'var(--tx)':'var(--bg)')+';color:'+(sect===v?'var(--bg)':'var(--tx)')+';border-color:'+(sect===v?'var(--tx)':'var(--bd2)')+'">'+l+'</button>').join('');
    $('root').innerHTML=pgH('Escanear con IA \ud83d\udcf8','vScan=false;render()')+'<div style="padding:16px"><p style="font-size:13px;color:var(--tx2);line-height:1.5;margin-bottom:16px">Fotograf\xeda una p\xe1gina del \xe1lbum. Claude detectar\xe1 qu\xe9 cromos est\xe1n pegados.</p>'+(!apiKey?'<div style="background:#FEF3C7;border-radius:var(--r);padding:12px;margin-bottom:14px;font-size:13px;color:#92400E">\u26a0\ufe0f Necesitas API key. <button onclick="vScan=false;vCfg=true;render()" style="background:none;border:none;color:'+RC+';font-weight:600;font-size:13px;cursor:pointer;text-decoration:underline">Configurar \u2192</button></div>':'')+
    '<div style="font-size:12px;font-weight:600;color:var(--tx);margin-bottom:8px">Secci\xf3n</div><div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px" id="sctabs">'+sctbs+'</div>'+
    '<div id="scteam" style="display:'+(sect==='team'?'block':'none')+'"><select onchange="window._st=this.value"><option value="">\u2014 Elige la selecci\xf3n \u2014</option>'+T.map(t=>'<option value="'+t.c+'" '+(tm===t.c?'selected':'')+'>'+t.f+' '+t.n+' ('+t.c+')</option>').join('')+'</select></div>'+
    '<input type="file" id="scf" accept="image/*" capture="environment" style="display:none" onchange="doScan(event)">'+
    (scanning?'<div style="text-align:center;padding:24px;color:var(--tx2)">\ud83d\udd0d Analizando imagen...</div>':
    '<button onclick="const o=window._sc!==\'team\'||window._st;if(o&&apiKey)document.getElementById(\'scf\')?.click();else if(!apiKey)flash(\'Configura tu API key en \u2699\ufe0f\',\'#F59E0B\');" style="width:100%;background:'+(ok&&apiKey?'var(--tx)':'var(--bg3)')+';color:'+(ok&&apiKey?'var(--bg)':'var(--tx2)')+';border:none;border-radius:12px;padding:14px;font-weight:600;font-size:15px">Abrir c\xe1mara \ud83d\udcf7</button>')+
    '<p style="font-size:11px;color:var(--tx2);margin-top:10px;text-align:center">Cromo 1 = escudo hologr\xe1fico \xb7 Cromo 13 = foto del equipo</p></div>';
    setHH();return;
  }

  const SECS=[{id:'fwc1',l:'FWC 1',col:RC,n:fn,t:8},{id:'teams',l:'Selecciones',col:BC,n:tn,t:960},{id:'fwc2',l:'FWC 2',col:OC,n:fn2,t:11},{id:'coca',l:'Coca-Cola',col:'#E8000B',n:cn,t:14},{id:'stats',l:'\ud83d\udcca',col:GC,n:null,t:null}];
  const tabs=SECS.map(s=>'<button onclick="go(\''+s.id+'\')" style="background:'+(sec===s.id?s.col:'var(--bg3)')+';color:'+(sec===s.id?'#fff':'var(--tx2)')+';border:none;border-radius:20px;padding:5px 9px;font-weight:600;font-size:11px;white-space:nowrap;flex-shrink:0">'+s.l+(s.n!==null?' \xb7 '+s.n+'/'+s.t:' \xb7 '+pct+'%')+'</button>').join('');
  const search=sec==='teams'?'<div style="padding:0 0 10px"><input type="text" id="si" placeholder="\ud83d\udd0d  Buscar por nombre o c\xf3digo..." value="'+sq+'" oninput="hs(this.value)"></div>':'';

  let content='';
  if(sec==='fwc1')content='<div style="padding:14px 12px"><div style="font-weight:600;font-size:14px;color:var(--tx);margin-bottom:3px">Secci\xf3n FWC 1</div><div style="font-size:12px;color:var(--tx2);margin-bottom:14px">Presentaci\xf3n del \xe1lbum \xb7 '+fn+'/8</div><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px">'+F1.map(id=>gb(id,RC)).join('')+'</div></div>';
  else if(sec==='teams'){
    const q=sq.toLowerCase();
    const fl=q?T.filter(t=>t.n.toLowerCase().includes(q)||t.c.toLowerCase().includes(q)):T;
    const compl=T.filter(t=>Array.from({length:20},(_,i)=>t.c+(i+1)).every(id=>owned.has(id))).length;
    content='<div><div style="padding:8px 14px;background:var(--bg);border-bottom:.5px solid var(--bd);font-size:12px;color:var(--tx2)"><b style="color:var(--tx)">'+compl+'</b> completos \xb7 '+tn+'/960</div><div id="tl">'+(fl.length?fl.map(tRow).join(''):'<div style="padding:30px;text-align:center;color:var(--tx2)">Sin resultados</div>')+'</div></div>';
  }
  else if(sec==='fwc2')content='<div style="padding:14px 12px"><div style="font-weight:600;font-size:14px;color:var(--tx);margin-bottom:3px">Secci\xf3n FWC 2</div><div style="font-size:12px;color:var(--tx2);margin-bottom:14px">Estadios y trofeo \xb7 '+fn2+'/11</div><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px">'+F2.map(id=>gb(id,OC)).join('')+'</div></div>';
  else if(sec==='coca')content='<div style="padding:14px 12px"><div style="font-weight:600;font-size:14px;color:var(--tx);margin-bottom:3px">Secci\xf3n Coca-Cola</div><div style="font-size:12px;color:var(--tx2);margin-bottom:14px">Patrocinador oficial \xb7 '+cn+'/14</div><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px">'+CC.map(id=>gb(id,'#E8000B')).join('')+'</div></div>';
  else if(sec==='stats')content=statsPage(fn,fn2,cn,tn,tot);

  $('root').innerHTML='<div class="hdr" id="hdr"><div style="background:'+RB+';height:4px"></div><div style="padding:12px 16px 0"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div><div style="font-size:9px;font-weight:700;color:var(--tx2);letter-spacing:2px;text-transform:uppercase">Panini \xb7 FIFA World Cup</div><div style="font-size:16px;font-weight:700;color:var(--tx)">Mi \xc1lbum 2026 \u26bd</div></div><div style="display:flex;align-items:center;gap:6px"><div style="text-align:right"><div style="font-size:22px;font-weight:800;color:'+RC+';line-height:1">'+pct+'%</div><div style="font-size:10px;color:var(--tx2)">'+tot+'/'+TOTAL+'</div></div><button onclick="vScan=true;window._sc=\'team\';window._st=\'\';render()" style="background:var(--bg2);border:.5px solid var(--bd2);border-radius:10px;width:38px;height:38px;font-size:18px" title="Escanear">\ud83d\udcf8</button><button onclick="vShare=true;window._ss=\'all\';render()" style="background:#25D366;border:none;border-radius:10px;width:38px;height:38px;font-size:18px" title="Compartir">\ud83d\udce4</button><button onclick="vCfg=true;render()" style="background:var(--bg2);border:.5px solid var(--bd2);border-radius:10px;width:38px;height:38px;font-size:18px" title="Ajustes">\u2699\ufe0f</button></div></div><div style="height:5px;background:var(--bg3);border-radius:999px;overflow:hidden;margin-bottom:10px"><div style="height:100%;width:'+pct+'%;background:'+RB+';border-radius:999px;transition:width .5s"></div></div><div style="display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px">'+tabs+'</div>'+search+'</div></div><div>'+content+'</div>';

  setHH();
  if(sec==='teams'&&sq){const inp=$('si');if(inp){inp.focus();const l=inp.value.length;inp.setSelectionRange(l,l);}}
}

function setHH(){
  const h=$('hdr');
  if(h)document.documentElement.style.setProperty('--hh',(h.offsetHeight+1)+'px');
}

window.addEventListener('load',()=>{
  try{
    const cv=document.createElement('canvas');cv.width=180;cv.height=180;
    const cx=cv.getContext('2d');cx.fillStyle='#E8192C';cx.beginPath();
    if(cx.roundRect)cx.roundRect(0,0,180,180,32);else cx.rect(0,0,180,180);
    cx.fill();cx.font='bold 90px serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText('\u26bd',90,95);
    const lk=document.createElement('link');lk.rel='apple-touch-icon';lk.href=cv.toDataURL();document.head.appendChild(lk);
  }catch(e){}
  try{
    const m=JSON.stringify({name:'\xc1lbum FIFA World Cup 2026',short_name:'\xc1lbum 2026',start_url:'.',display:'standalone',background_color:'#ffffff',theme_color:'#E8192C'});
    const blob=new Blob([m],{type:'application/json'});
    const lk=document.createElement('link');lk.rel='manifest';lk.href=URL.createObjectURL(blob);document.head.appendChild(lk);
  }catch(e){}
});
window.addEventListener('resize',setHH);
loadStorage();
